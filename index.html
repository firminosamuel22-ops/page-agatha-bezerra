<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Dra. Ágatha Bezerra</title>

  <link
    href="https://fonts.googleapis.com/css?family=Shadows+Into+Light"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Shadows Into Light", cursive;
      color: #111;
      overflow: hidden;
      background: #fff;
    }

    /* ============================= */
    /* ANIMAÇÃO */
    /* ============================= */

    @keyframes throb {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.2);
      }

      85% {
        transform: scale(1);
      }
    }

    .throb {
      animation: throb 0.5s infinite;
      animation-delay: 0.8s;
    }

    /* ============================= */
    /* CONTAINER */
    /* ============================= */

    .wrapper {
      width: 90vmin;
      height: 90vmin;
      position: relative;
      margin: auto;
    }

    /* ============================= */
    /* CHECKBOXES */
    /* ============================= */

    input[type="checkbox"] {
      display: none;
    }

    input[type="checkbox"] + label {
      width: 30vmin;
      height: 30vmin;
      line-height: 30vmin;
      display: inline-block;
      position: absolute;
      font-size: 30vmin;
      text-align: center;
      transition: all 1s ease;
      user-select: none;
    }

    label {
      text-shadow: 3vmin 3vmin 10vmin rgba(0, 0, 0, 0.5);
    }

    label:hover {
      color: #c32a2a;
      cursor: pointer;
    }

    /* ============================= */
    /* Á */
    /* ============================= */

    #ck1 + label {
      left: 0;
      top: 0;
      border-radius: 50%;
    }

    /* ============================= */
    /* GA */
    /* ============================= */

    #ck2 + label {
      right: 10vmin;
      top: 0;
      border-radius: 50%;
    }

    /* ============================= */
    /* THA */
    /* ============================= */

    #ck3 + label {
      bottom: 5vmin;
      left: 50%;
      margin-left: -9vmin;
      background-color: white;
    }

    /* ============================= */
    /* QUANDO CLICAR */
    /* ============================= */

    #ck1:checked + label,
    #ck2:checked + label,
    #ck3:checked + label {
      background: #800080;
      font-size: 0;
      transition: all 1s ease;
    }

    #ck1:checked + label,
    #ck2:checked + label {
      width: 54vmin;
      height: 54vmin;
      border-radius: 50%;
      line-height: 54vmin;
    }

    #ck2:checked + label {
      right: 0;
    }

    #ck3:checked + label {
      width: 49.5vmin;
      height: 49.5vmin;
      bottom: 17.28vmin;
      left: 29.16vmin;
      transform: rotate(45deg);
      line-height: 4.86vmin;
    }

    /* ============================= */
    /* MENSAGEM */
    /* ============================= */

    #mensagem {
      display: none;
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-1.5deg);
      color: white;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
      z-index: 10;
    }

    .frase-principal {
      font-size: 10vmin;
    }

    .nome-doutora {
      font-size: 7vmin;
      margin-top: 1vmin;
    }

    /* ============================= */
    /* TEXTO INFERIOR */
    /* ============================= */

    .instrucao {
      display: inline-block;
      text-align: left;
      position: absolute;
      bottom: 0;
      left: 0;
      margin-bottom: -3vmin;
      font-size: 6vmin;
      color: #999;
    }

    /* ============================= */
    /* CELULAR */
    /* ============================= */

    @media (max-width: 600px) {
      .wrapper {
        width: 95vmin;
        height: 95vmin;
      }

      .frase-principal {
        font-size: 8vmin;
      }

      .nome-doutora {
        font-size: 5.5vmin;
      }

      .instrucao {
        font-size: 5vmin;
      }
    }
  </style>
</head>

<body>

  <form>
    <div class="wrapper">

      <!-- Á -->
      <input type="checkbox" id="ck1" onclick="check()">
      <label for="ck1">Á</label>

      <!-- GA -->
      <input type="checkbox" id="ck2" onclick="check()">
      <label for="ck2">GA</label>

      <!-- THA -->
      <input type="checkbox" id="ck3" onclick="check()">
      <label for="ck3">THA</label>

      <!-- Instruções -->
      <span class="instrucao">
        (Clique nas palavras)
      </span>

      <!-- Mensagem final -->
      <div id="mensagem">
        <div class="frase-principal">
          VOCÊ É INCRÍVEL!
        </div>

        <div class="nome-doutora">
          DRA. ÁGATHA BEZERRA 🦷
        </div>
      </div>

    </div>
  </form>

  <script>
    function check() {
      const ck1 = document.getElementById("ck1");
      const ck2 = document.getElementById("ck2");
      const ck3 = document.getElementById("ck3");

      const wrapper = document.querySelector(".wrapper");
      const mensagem = document.getElementById("mensagem");

      if (ck1.checked && ck2.checked && ck3.checked) {
        wrapper.classList.add("throb");
        mensagem.style.display = "block";
      } else {
        wrapper.classList.remove("throb");
        mensagem.style.display = "none";
      }
    }
  </script>

</body>
</html>
```
